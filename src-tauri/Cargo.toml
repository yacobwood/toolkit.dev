[package]
name = "toolkit-dev"
version = "1.0.0"
description = "ToolKit.dev — Free Developer Tools"
authors = ["you"]
edition = "2021"

[lib]
name = "toolkit_dev_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
